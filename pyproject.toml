[project]
name = "soundkeyboard"
version = "0.1.0"
description = "A desktop soundboard with keyboard shortcuts"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pygame>=2.5.2",
    "PyQt5>=5.15",
    "keyboard>=0.13.5; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<0.15",
]
build = [
    "pyinstaller>=6.16,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]
extend-include = ["*.spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"build.spec" = ["F821"]  # PyInstaller supplies its build API as execution globals.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
