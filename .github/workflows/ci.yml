name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_AUDIODRIVER: dummy
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.14
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Check lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.14
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --locked --python "${{ matrix.python-version }}" pytest

  build:
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            expected_arch: X64
          - os: macos-15
            target: macos-arm64
            expected_arch: ARM64
          - os: macos-15-intel
            target: macos-x86_64
            expected_arch: X64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.14
          enable-cache: true
      - name: Verify runner architecture on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne '${{ matrix.expected_arch }}') {
            throw "Expected ${{ matrix.expected_arch }} runner, got $env:RUNNER_ARCH"
          }
      - name: Verify runner architecture on macOS
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Install locked application and build dependencies
        run: uv sync --locked --no-default-groups --group build
      - name: Build application
        run: uv run --locked --no-sync pyinstaller --clean --noconfirm build.spec
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -Path "dist/SoundKeyboard.exe" -Destination "dist/SoundKeyboard-${{ matrix.target }}.exe"
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/SoundKeyboard.app dist/SoundKeyboard-${{ matrix.target }}.app.zip
      - name: Smoke test packaged Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/SoundKeyboard-${{ matrix.target }}.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          exit $process.ExitCode
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: |
          roundtrip_dir="$RUNNER_TEMP/SoundKeyboard-${{ matrix.target }}"
          mkdir -p "$roundtrip_dir"
          ditto -x -k "dist/SoundKeyboard-${{ matrix.target }}.app.zip" "$roundtrip_dir"
          app_path="$roundtrip_dir/SoundKeyboard.app"
          codesign --verify --deep --strict "$app_path"
          "$app_path/Contents/MacOS/SoundKeyboard" --smoke-test
      - name: Upload runnable build asset
        uses: actions/upload-artifact@v4
        with:
          name: SoundKeyboard-${{ matrix.target }}
          path: dist/SoundKeyboard-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI required
    if: ${{ always() }}
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success

  publish-preview:
    name: Publish preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JoeyTeng/SoundKeyboard'
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: soundkeyboard-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this run's validated builds
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: SoundKeyboard-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_preview.py release-assets
